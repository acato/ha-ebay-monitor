# =============================================================================
# eBay Monitor - Notification Automations
# =============================================================================
# Add these to your automations.yaml or create them in the HA UI.
#
# These automations listen for the ebay_monitor_new_listing event and send
# rich, actionable notifications through your existing notification channels.
#
# Adjust notify service targets to match your setup:
#   - notify.mobile_app_iphone_13      (Alessandro's phone)
#   - notify.mobile_app_mini_iphone_16 (Elena's phone)
#   - Or any other notify service you have configured
# =============================================================================

# ---------------------------------------------------------------------------
# 1. MOBILE PUSH with actionable buttons (Companion App)
# ---------------------------------------------------------------------------
# This is the primary notification: rich push with thumbnail image and
# three action buttons: View on eBay, Buy Now, Place Bid.
# The URI actions open the listing directly in the eBay app or browser.
# ---------------------------------------------------------------------------
- id: ebay_monitor_mobile_push
  alias: "eBay Monitor - Mobile Push Notification"
  description: "Send actionable push notification when a new eBay listing matches"
  mode: queued
  max: 20

  trigger:
    - platform: event
      event_type: ebay_monitor_new_listing

  # Optional: filter to only high-value alerts
  # condition:
  #   - condition: template
  #     value_template: "{{ trigger.event.data.price | float <= 4000 }}"

  action:
    - action: notify.mobile_app_iphone_13
      data:
        title: "eBay Deal: {{ trigger.event.data.search_name }}"
        message: >-
          {{ trigger.event.data.title }}
          ${{ "%.2f" | format(trigger.event.data.price) }}
          ({{ trigger.event.data.condition }})
          Seller: {{ trigger.event.data.seller_name }}
          ({{ trigger.event.data.seller_feedback_percentage }}% feedback)
          {% if trigger.event.data.bid_count > 0 %}
          Bids: {{ trigger.event.data.bid_count }}
          {% endif %}
          {% if trigger.event.data.time_remaining %}
          Ends: {{ trigger.event.data.time_remaining }}
          {% endif %}
        data:
          # Listing thumbnail image
          image: "{{ trigger.event.data.image_url }}"
          # Clickable URL when tapping the notification body
          url: "{{ trigger.event.data.url }}"
          clickAction: "{{ trigger.event.data.url }}"
          # Action buttons
          actions:
            - action: "URI"
              title: "View on eBay"
              uri: "{{ trigger.event.data.url }}"
            - action: "URI"
              title: "Buy Now"
              uri: "{{ trigger.event.data.url }}"
            - action: "DISMISS_{{ trigger.event.data.item_id }}"
              title: "Dismiss"
          # Group notifications by search name so they stack
          group: "ebay_{{ trigger.event.data.search_name }}"
          # Android notification channel
          channel: "eBay Alerts"
          importance: high
          # iOS specific
          push:
            sound:
              name: default
              critical: 0

# ---------------------------------------------------------------------------
# 2. PRICE-TIER ALERTING - Critical alerts for exceptional deals
# ---------------------------------------------------------------------------
# If the price is under 50% of max_price, send a critical notification
# that bypasses Do Not Disturb. Adjust thresholds to your needs.
# ---------------------------------------------------------------------------
- id: ebay_monitor_critical_deal
  alias: "eBay Monitor - Critical Deal Alert"
  description: "High-priority alert when an exceptional deal is found"
  mode: queued
  max: 10

  trigger:
    - platform: event
      event_type: ebay_monitor_new_listing

  condition:
    # Example: A100 80GB under $3000 is an exceptional deal
    - condition: template
      value_template: >-
        {{ trigger.event.data.search_name == 'nvidia_a100'
           and trigger.event.data.price | float <= 3000 }}

  action:
    - action: notify.mobile_app_iphone_13
      data:
        title: "EXCEPTIONAL DEAL FOUND"
        message: >-
          {{ trigger.event.data.title }}
          ONLY ${{ "%.2f" | format(trigger.event.data.price) }}!
          Act fast - {{ trigger.event.data.condition }}
        data:
          image: "{{ trigger.event.data.image_url }}"
          url: "{{ trigger.event.data.url }}"
          actions:
            - action: "URI"
              title: "BUY NOW"
              uri: "{{ trigger.event.data.url }}"
          push:
            sound:
              name: default
              critical: 1
              volume: 1.0
          # Android: override DND
          ttl: 0
          priority: high
          channel: "eBay Critical"
          importance: high

# ---------------------------------------------------------------------------
# 3. MULTI-CHANNEL NOTIFICATION (email + push)
# ---------------------------------------------------------------------------
# Send to multiple channels. This example sends both a push notification
# and an email digest. Replace notify.email with your configured service.
# ---------------------------------------------------------------------------
- id: ebay_monitor_multi_channel
  alias: "eBay Monitor - Multi-Channel Alert"
  description: "Send eBay alerts to multiple notification channels"
  mode: queued
  max: 20

  trigger:
    - platform: event
      event_type: ebay_monitor_new_listing

  action:
    # Push notification (same as above, abbreviated)
    - action: notify.mobile_app_iphone_13
      data:
        title: "eBay: {{ trigger.event.data.search_name }}"
        message: >-
          {{ trigger.event.data.title }} -
          ${{ "%.2f" | format(trigger.event.data.price) }}
        data:
          image: "{{ trigger.event.data.image_url }}"
          url: "{{ trigger.event.data.url }}"
          actions:
            - action: "URI"
              title: "View on eBay"
              uri: "{{ trigger.event.data.url }}"

    # Email notification with HTML formatting
    # Replace 'notify.email' with your configured SMTP/email service
    - action: notify.email
      data:
        title: "eBay Alert: {{ trigger.event.data.title }}"
        message: >-
          New listing found for search "{{ trigger.event.data.search_name }}":

          {{ trigger.event.data.title }}
          Price: ${{ "%.2f" | format(trigger.event.data.price) }} {{ trigger.event.data.currency }}
          Condition: {{ trigger.event.data.condition }}
          Seller: {{ trigger.event.data.seller_name }} ({{ trigger.event.data.seller_feedback_percentage }}% positive)
          Location: {{ trigger.event.data.item_location }}

          View listing: {{ trigger.event.data.url }}

    # Persistent notification in HA frontend
    - action: persistent_notification.create
      data:
        title: "eBay: {{ trigger.event.data.title }}"
        message: >-
          **${{ "%.2f" | format(trigger.event.data.price) }}** -
          {{ trigger.event.data.condition }}

          Seller: {{ trigger.event.data.seller_name }}
          ({{ trigger.event.data.seller_feedback_percentage }}%)

          [View on eBay]({{ trigger.event.data.url }})
        notification_id: "ebay_{{ trigger.event.data.item_id }}"

# ---------------------------------------------------------------------------
# 4. DAILY DIGEST - Summary of all active searches
# ---------------------------------------------------------------------------
# Instead of per-listing alerts, send a daily summary at 9 AM.
# Uses the sensor attributes which contain the latest listings.
# ---------------------------------------------------------------------------
- id: ebay_monitor_daily_digest
  alias: "eBay Monitor - Daily Digest"
  description: "Daily summary of all eBay search results"
  mode: single

  trigger:
    - platform: time
      at: "09:00:00"

  condition:
    # Only send if there are results worth reporting
    - condition: template
      value_template: >-
        {{ states('sensor.ebay_nvidia_a100') | int(0) > 0
           or state_attr('sensor.ebay_nvidia_a100', 'total_results') | int(0) > 0 }}

  action:
    - action: notify.mobile_app_iphone_13
      data:
        title: "eBay Daily Digest"
        message: >-
          {% set listings = state_attr('sensor.ebay_nvidia_a100', 'latest_listings') %}
          {% if listings %}
          Top listings for NVIDIA A100:
          {% for item in listings[:5] %}
          - {{ item.title[:60] }} - ${{ "%.0f" | format(item.price) }} ({{ item.condition }})
          {% endfor %}
          {% else %}
          No new listings found.
          {% endif %}

# ---------------------------------------------------------------------------
# 5. PRICE DROP ALERT - Notify when a previously-seen listing drops in price
# ---------------------------------------------------------------------------
# Fires on the ebay_monitor_price_drop event, which includes the previous
# price, drop amount, and drop percentage alongside all listing details.
# ---------------------------------------------------------------------------
- id: ebay_monitor_price_drop
  alias: "eBay Monitor - Price Drop Alert"
  description: "Alert when a previously-seen listing drops in price"
  mode: queued
  max: 20

  trigger:
    - platform: event
      event_type: ebay_monitor_price_drop

  action:
    - action: notify.mobile_app_iphone_13
      data:
        title: "Price Drop: {{ trigger.event.data.search_name }}"
        message: >-
          {{ trigger.event.data.title }}
          Was ${{ "%.2f" | format(trigger.event.data.previous_price) }}
          Now ${{ "%.2f" | format(trigger.event.data.price) }}
          (-{{ trigger.event.data.drop_percentage }}%)
          Seller: {{ trigger.event.data.seller_name }}
        data:
          image: "{{ trigger.event.data.image_url }}"
          url: "{{ trigger.event.data.url }}"
          clickAction: "{{ trigger.event.data.url }}"
          actions:
            - action: "URI"
              title: "View on eBay"
              uri: "{{ trigger.event.data.url }}"
            - action: "URI"
              title: "Buy Now"
              uri: "{{ trigger.event.data.url }}"
          group: "ebay_{{ trigger.event.data.search_name }}"
          channel: "eBay Price Drops"
          importance: high
